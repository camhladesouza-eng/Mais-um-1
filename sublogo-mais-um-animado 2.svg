<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A00"/><stop offset=".5" stop-color="#EA1D2C"/><stop offset="1" stop-color="#6C2BD9"/></linearGradient></defs>
<style>
.sp{transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite}
.s2{animation-delay:.8s}
.ic{transform-box:fill-box;transform-origin:50% 100%;animation:bounce 1.8s cubic-bezier(.3,1.6,.5,1) infinite}
.pill{transform-box:fill-box;transform-origin:center;animation:wig 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.5}50%{transform:scale(1.2);opacity:1}}
@keyframes bounce{0%,60%,100%{transform:translateY(0) rotate(-6deg)}30%{transform:translateY(-16px) rotate(4deg)}}
@keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
</style>
