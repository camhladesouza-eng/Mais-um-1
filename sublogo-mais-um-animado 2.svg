<path class="sp" d="M410 100 Q414 114 428 118 Q414 122 410 136 Q406 122 392 118 Q406 114 410 100Z" fill="#fff"/>
<path class="sp s2" d="M100 392 Q103 402 113 405 Q103 408 100 418 Q97 408 87 405 Q97 402 100 392Z" fill="#fff"/>
